[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-ml-system"
version = "1.0.0"
description = "End-to-end leakage-safe BTS flight-delay prediction system"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "airportsdata==20260905",
  "catboost==1.2.10",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "joblib==1.6.0",
  "lightgbm==4.7.0",
  "matplotlib==3.11.2",
  "pandas==2.3.3",
  "polars==2.1.0",
  "prometheus-client==0.26.0",
  "pyarrow==23.0.1",
  "pydantic==2.14.4",
  "PyYAML==6.0.4",
  "scikit-learn==1.9.1",
  "seaborn==0.13.2",
  "shap==0.49.1",
  "tenacity==9.2.1",
  "tzdata==2026.6",
  "uvicorn==0.54.0",
  "xgboost==3.2.0",
  "optuna==5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio>=0.25,<2",
  "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

