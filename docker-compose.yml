services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLIGHT_DELAY_MODEL_PATH: /app/models/flight_delay_bundle.joblib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

